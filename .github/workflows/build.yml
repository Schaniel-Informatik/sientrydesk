# Build und Tests bei jedem Push, die beiden Pakete als Download (14 Tage). Eine Versionsmarke v<Version> legt
# zusätzlich einen Release-Entwurf mit beiden ZIP-Dateien an, Marcel veröffentlicht ihn nach Durchsicht.
# Läuft auf Linux, das .NET SDK baut die Windows-Programme dank EnableWindowsTargeting auch dort (wie auf dem Mac).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Versionsmarke passt zur Version im Code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Marke $GITHUB_REF_NAME, im Code $version"; exit 1; }
      - name: Tests und Pakete
        run: bash build/publish.sh
      - uses: actions/upload-artifact@v4
        with:
          name: SIEntryDesk-packages
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: SIEntryDesk-packages
          path: packages
      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.zip --repo "$GITHUB_REPOSITORY" --draft \
            --title "SI EntryDesk ${GITHUB_REF_NAME#v}" --generate-notes
