# Build and tests on every push, both packages as a download (14 days). A version tag v<Version> also creates a
# draft release with both ZIP files, Marcel publishes it after review.
# Runs on Linux, thanks to EnableWindowsTargeting the .NET SDK builds the Windows programs there too (as on the Mac).
name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Versionsmarke passt zur Version im Code
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(sed -n 's:.*<Version>\(.*\)</Version>.*:\1:p' Directory.Build.props)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Marke $GITHUB_REF_NAME, im Code $version"; exit 1; }
      - name: Tests und Pakete
        run: bash build/publish.sh
      - uses: actions/upload-artifact@v7
        with:
          name: SIEntryDesk-packages
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: SIEntryDesk-packages
          path: packages
      - name: Release-Entwurf anlegen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" packages/*.zip --repo "$GITHUB_REPOSITORY" --draft \
            --title "SI EntryDesk ${GITHUB_REF_NAME#v}" --generate-notes
